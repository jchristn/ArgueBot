name: arguebot-provider-tests
services:
  postgresql:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: arguebot_test
      POSTGRES_USER: arguebot_test
      POSTGRES_PASSWORD: arguebot-provider-fixture-not-for-production
    ports:
      - "127.0.0.1:4450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arguebot_test -d arguebot_test"]
      interval: 5s
      timeout: 5s
      retries: 2
