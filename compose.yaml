name: arguebot-observability
services:
  collector:
    build:
      context: .
      dockerfile: docker/observability/Dockerfile.collector
    command: ["--config=/etc/collector.yaml"]
    ports: ["127.0.0.1:4327:4317"]
    volumes: ["./docker/observability/collector.yaml:/etc/collector.yaml:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 5s
      retries: 2
    depends_on:
      tempo:
        condition: service_healthy
  prometheus:
    build:
      context: .
      dockerfile: docker/observability/Dockerfile.prometheus
    command: ["--config.file=/etc/prometheus.yaml", "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:9097:9090"]
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 2
  tempo:
    build:
      context: .
      dockerfile: docker/observability/Dockerfile.tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["127.0.0.1:3207:3200"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 40s
  loki:
    build:
      context: .
      dockerfile: docker/observability/Dockerfile.loki
    command: ["-config.file=/etc/loki.yaml"]
    ports: ["127.0.0.1:3107:3100"]
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 40s
  grafana:
    image: grafana/grafana-oss:13.0.2
    ports: ["127.0.0.1:3007:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: arguebot-local-observability
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./assets/grafana:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 2
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
  loki-data:
