name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - name: Restore locked dependencies
        run: dotnet restore src/ArgueBot.sln --locked-mode
      - name: Build all targets
        run: dotnet build src/ArgueBot.sln -c Release --no-restore
      - name: Shared console suite with real CLI fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          $env:ARGUEBOT_CLI_FIXTURE = Join-Path $PWD 'src/Test.Fixtures/bin/Release/net10.0/Test.Fixtures.dll'
          dotnet run --project src/Test.Automated -c Release --no-build -- --results test-results/console.json
          exit $LASTEXITCODE
      - name: xUnit shared suite on both supported runtimes
        run: dotnet test src/Test.Xunit -c Release --no-build --logger trx --results-directory test-results/xunit
      - name: NUnit shared suite on both supported runtimes
        run: dotnet test src/Test.Nunit -c Release --no-build --logger trx --results-directory test-results/nunit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.os }}
          path: test-results
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Restore service
        run: dotnet restore src/ArgueBot.Server --locked-mode
      - name: Legacy compatibility build
        run: npm ci && npm run build
      - name: Dashboard checks
        working-directory: dashboard
        run: npm ci && npm run i18n:check && npm run lint && npm run test:ci
      - name: Install browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Browser journeys
        working-directory: dashboard
        run: npm run test:e2e
      - name: Generated API artifact drift
        run: node scripts/generate-api.mjs && git diff --exit-code -- REST_API.md assets/postman
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-evidence
          path: |
            .run/browser-report
            .run/browser-results
            .run/screenshots
