name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ARGUEBOT_TUI_EVIDENCE_DIR: ${{ github.workspace }}/test-results/terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - name: Restore locked dependencies
        run: dotnet restore src/ArgueBot.sln --locked-mode
      - name: Build all targets
        run: dotnet build src/ArgueBot.sln -c Release --no-restore
      - name: Shared console suite with real CLI fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          $env:ARGUEBOT_CLI_FIXTURE = Join-Path $PWD 'src/Test.Fixtures/bin/Release/net10.0/Test.Fixtures.dll'
          dotnet run --project src/Test.Automated -c Release --no-build -- --results test-results/console.json
          exit $LASTEXITCODE
      - name: CLI conversation and participant lifecycle smoke
        run: node scripts/test-cli-surfaces.mjs
      - name: xUnit shared suite on both supported runtimes
        run: dotnet test src/Test.Xunit -c Release --no-build --logger trx --results-directory test-results/xunit
      - name: NUnit shared suite on both supported runtimes
        run: dotnet test src/Test.Nunit -c Release --no-build --logger trx --results-directory test-results/nunit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.os }}
          path: test-results
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Restore service
        run: dotnet restore src/ArgueBot.Server --locked-mode && dotnet restore src/Test.Fixtures --locked-mode && dotnet restore src/ArgueBot.Cli --locked-mode
      - name: Dashboard checks
        working-directory: dashboard
        run: npm ci && npm run i18n:check && npm run lint && npm run test:ci
      - name: Install browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Browser journeys
        working-directory: dashboard
        run: npm run test:e2e
      - name: Generated API artifact drift
        run: node scripts/generate-api.mjs && git diff --exit-code -- REST_API.md assets/postman assets/transport.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-evidence
          path: |
            .run/browser-report
            .run/browser-results
            .run/screenshots
  integration:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: arguebot_test
          POSTGRES_USER: arguebot_test
          POSTGRES_PASSWORD: arguebot-provider-fixture-not-for-production
        ports: ['127.0.0.1:4450:5432']
        options: >-
          --health-cmd "pg_isready -U arguebot_test -d arguebot_test"
          --health-interval 5s --health-timeout 5s --health-retries 2
    env:
      ARGUEBOT_TEST_POSTGRESQL: Host=127.0.0.1;Port=4450;Database=arguebot_test;Username=arguebot_test;Password=arguebot-provider-fixture-not-for-production
      ARGUEBOT_SIMULATION_URL: http://127.0.0.1:4491
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - run: dotnet restore src/ArgueBot.sln --locked-mode && dotnet build src/ArgueBot.sln -c Release --no-restore
      - name: Locked dependency inventory drift
        run: node scripts/generate-dependencies.mjs && git diff --exit-code -- assets/dependencies.json
      - name: Start the committed Postman runner fixture
        run: |
          mkdir -p .run test-results
          PORT=4491 node --input-type=commonjs < postman/mocks/ollama/default.js >.run/runner-fixture.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS -H 'Content-Type: application/json' -d '{"model":"fixture","messages":[],"stream":true}' http://127.0.0.1:4491/api/chat; then break; fi
            sleep 1
          done
          curl -fsS -H 'Content-Type: application/json' -d '{"model":"fixture","messages":[],"stream":true}' http://127.0.0.1:4491/api/chat
      - name: All supported provider and runner descriptors
        run: ARGUEBOT_CLI_FIXTURE="$PWD/src/Test.Fixtures/bin/Release/net10.0/Test.Fixtures.dll" dotnet run --project src/Test.Automated -c Release --no-build -- --results test-results/integration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            test-results
            .run/runner-fixture.log
